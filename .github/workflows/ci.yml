name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[test]" && python -m playwright install chromium
      - run: python -m pytest -q
  llama-cpp:
    # the fast GGUF engine for real: download llama.cpp's release build and run a tiny model
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: python -m pytest -q tests/test_llamacpp.py -k real
        env: { OMNICOMPUTE_TEST_REAL_LLAMA: "1", GITHUB_TOKEN: "${{ github.token }}" }
  nat-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . && sudo apt-get install -y iproute2 iptables
      - run: sudo -E env PATH="$PATH" PY="$(which python)" scripts/nat_sim.sh
  app:
    # one-file apps people can double-click: omnicompute.exe (Windows), omnicompute (macOS, Linux)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller .
      - run: python scripts/build_app.py
      - uses: actions/upload-artifact@v4
        with: { name: "omnicompute-${{ runner.os }}", path: dist/ }
