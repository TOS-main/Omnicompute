[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemesh"
version = "0.3.3"
description = "Split AI model inference across phones and computers on any network"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "cryptography>=3.4", "aiohttp>=3.8", "tokenizers>=0.15", "jinja2>=3", "segno>=1.5",
                "threadpoolctl>=3", "wgpu>=0.19"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "playwright", "torch", "transformers"]

[project.scripts]
edgemesh = "edgemesh.cli:main"

[tool.setuptools]
packages = ["edgemesh"]

[tool.setuptools.package-data]
edgemesh = ["web/*", "installers/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
